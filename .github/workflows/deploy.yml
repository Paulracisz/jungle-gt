name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # After your first local `npm install`, commit package-lock.json,
          # then add `cache: npm` here and swap `npm install` for `npm ci`.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Advisory on the first deploy: flip to a hard gate (delete the next line)
      # once `npm run typecheck` is clean on your machine.
      - name: Type check
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
